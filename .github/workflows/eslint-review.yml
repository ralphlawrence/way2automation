name: Automated ESLint review (reviewdog)

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  eslint-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies if present, else install ESLint globally
        run: |
          if [ -f package-lock.json ] || [ -f package.json ]; then
            npm ci
          else
            npm install -g eslint
          fi

      - name: Run ESLint and post review comments via reviewdog
        uses: reviewdog/action-run@v1
        with:
          name: eslint
          command: npx eslint -f unix .
          reporter: github-pr-review
          level: warning
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
