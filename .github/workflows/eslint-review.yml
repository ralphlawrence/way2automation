name: Automated ESLint review (reviewdog)

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  eslint-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies if present, else install ESLint globally
        run: |
          if [ -f package-lock.json ] || [ -f package.json ]; then
            npm ci
          else
            npm install -g eslint
          fi

      - name: Install reviewdog CLI
        run: |
          # download latest linux amd64 binary and install to /usr/local/bin
          curl -sSL https://github.com/reviewdog/reviewdog/releases/latest/download/reviewdog_linux_amd64.zip -o /tmp/reviewdog.zip
          unzip -q /tmp/reviewdog.zip -d /tmp
          sudo mv /tmp/reviewdog /usr/local/bin/reviewdog
          reviewdog -version

      - name: Run ESLint and post review comments via reviewdog
        run: |
          # run eslint in unix format and pipe to reviewdog
          npx eslint -f unix . | reviewdog -efm="%f:%l:%c: %m" -name="eslint" -reporter=github-pr-review -level=warning
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
