name: Automated ESLint review (reviewdog)

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  eslint-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies if present, else install ESLint globally
        run: |
          if [ -f package-lock.json ] || [ -f package.json ]; then
            npm ci
          else
            npm install -g eslint
          fi

      - name: Install reviewdog CLI
        run: |
          set -euo pipefail
          URL="https://github.com/reviewdog/reviewdog/archive/refs/tags/v0.21.0.zip"
          OUT=/tmp/reviewdog.zip

          # retry download up to 3 times with backoff
          for i in 1 2 3; do
            echo "Downloading reviewdog (attempt $i)..."
            curl -fL "$URL" -o "$OUT" && break || {
              echo "reviewdog download failed (attempt $i). Retrying..."
              sleep $((i * 2))
            }
          done

          # sanity checks: file exists and non-empty
          if [ ! -s "$OUT" ]; then
            echo "ERROR: reviewdog zip not downloaded or empty"
            ls -l "$OUT" || true
            echo "First 400 bytes of downloaded file for debugging:"
            head -c 400 "$OUT" | sed -n '1,200p' || true
            exit 1
          fi

          # verify zip integrity
          unzip -tq "$OUT" || {
            echo "ERROR: downloaded file is not a valid zip"
            file "$OUT" || true
            exit 1
          }

          # extract and install
          unzip -q "$OUT" -d /tmp
          sudo mv /tmp/reviewdog /usr/local/bin/reviewdog
          sudo chmod +x /usr/local/bin/reviewdog
          reviewdog -version

      - name: Run ESLint and post review comments via reviewdog
        run: |
          # run eslint in unix format and pipe to reviewdog
          npx eslint -f unix . | reviewdog -efm="%f:%l:%c: %m" -name="eslint" -reporter=github-pr-review -level=warning
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
